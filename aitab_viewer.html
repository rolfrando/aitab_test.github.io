<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Generated Page</title>

<!--
  ============================================================================
  AITAB VIEWER  (A2UI surface renderer — 9-component catalog)
  ----------------------------------------------------------------------------
  Renders an A2UI surface: { "components": [ { id, component, ...props } ],
  "dataModel": {} }. Exactly one component has id "root" (a Page); parents
  reference children by id; displayed data lives in `dataModel` and props bind
  to it with { "path": "/..." }; array props may be a literal array or a
  binding. Components (per component_schema.json): Page, Header, TextBlock,
  RankedTable, Cards, SourceLinks, List, Timeline, Highlights.

  Read from the URL hash — "#" + encodeURIComponent(JSON.stringify(surface));
  the embedded #surface-config is a fallback demo. Static render (the catalog
  has no interactive props). Mozilla design tokens, light.
  ============================================================================
-->
<script type="application/json" id="surface-config">
{
  "components": [
    { "id": "root", "component": "Page", "header": "hdr",
      "children": ["ans", "trio_note", "quotes", "picks", "plan", "todo", "notes", "srcs"] },
    { "id": "hdr", "component": "Header",
      "title": "Heat Pump for a 1940s House",
      "subhead": "What nine sources agree on — and where they don't",
      "references": { "items": { "path": "/sources" } } },
    { "id": "ans", "component": "Highlights",
      "eyebrow": "The short answer",
      "title": "A cold-climate heat pump works here — paired with the furnace for the coldest nights.",
      "body": "Eight of nine sources back dual-fuel for 1940s retrofits.",
      "sources": { "items": { "path": "/sources" } } },
    { "id": "trio_note", "component": "TextBlock",
      "lead": "Rated output holds to about 5°F; below that the furnace covers a handful of nights a year." },
    { "id": "quotes", "component": "RankedTable", "title": "Installer Quotes",
      "description": "Bids pulled from the PDFs in your tabs",
      "columns": [
        { "key": "name", "label": "Installer", "type": "text", "role": "title" },
        { "key": "source", "label": "", "type": "text", "role": "subtitle" },
        { "key": "price", "label": "Quote", "type": "currency", "role": "detail", "goal": "min" },
        { "key": "rating", "label": "Rating", "type": "rating", "role": "detail", "max": 5, "goal": "max" }
      ],
      "rows": { "path": "/quotes" } },
    { "id": "picks", "component": "Cards", "title": "Two ways to go",
      "items": { "path": "/cards" } },
    { "id": "plan", "component": "Timeline", "title": "If we go ahead",
      "items": { "path": "/plan" } },
    { "id": "todo", "component": "List", "title": "Before deciding",
      "groups": { "path": "/todo" } },
    { "id": "notes", "component": "TextBlock",
      "paragraphs": { "path": "/notes" } },
    { "id": "srcs", "component": "SourceLinks", "title": "Sources",
      "items": { "path": "/sources" } }
  ],
  "dataModel": {
    "sources": [
      { "title": "energy.gov", "href": "https://energy.gov" },
      { "title": "NEEP", "href": "https://neep.org" },
      { "title": "r/heatpumps", "href": "https://reddit.com/r/heatpumps" }
    ],
    "quotes": [
      { "name": "Bright Build", "source": "yelp.com", "price": 31200, "rating": 4.6 },
      { "name": "Sterling Mechanical", "source": "google.com", "price": 37800, "rating": 4.8 },
      { "name": "Northwest Comfort", "source": "angi.com", "price": 34000, "rating": 4.2 }
    ],
    "cards": [
      { "eyebrow": "Recommended", "title": "Cold-climate heat pump + keep the furnace", "link_title": "Spec at NEEP", "href": "https://neep.org" },
      { "eyebrow": "Simpler", "title": "Full electric, no backup", "link_title": "Sizing guide", "href": "https://energy.gov" }
    ],
    "plan": [
      { "date_label": "Week 1", "date_eyebrow": "Now", "title": "Manual J + two quotes", "description": "Size to the measured load, not the old furnace's rating." },
      { "date_label": "Week 3", "title": "Permit & order equipment", "description": "City permit filed; account for lead time." },
      { "date_label": "Week 6", "date_eyebrow": "Done", "title": "Install & inspect" }
    ],
    "todo": [
      { "heading": "This week", "items": [ { "text": "Get a Manual J load calculation" }, { "text": "Confirm the electric-to-gas price ratio" } ] },
      { "heading": "Before signing", "items": [ { "text": "Ask each installer about their cold-climate model line" }, { "text": "Check rebate eligibility" } ] }
    ],
    "notes": [
      "Air sealing and attic insulation move the payback more than the model on the invoice.",
      "Dual-fuel setups are sized around a switchover temperature, not a worst-case night."
    ]
  }
}
</script>

<style>
  :root {
    --ink: #15141A; --ink-2: #42414D; --muted: #6F6E77; --muted-2: #8F8F9D;
    --accent: #7543E3; --accent-ink: #210340; --accent-soft: #F0EAFD;
    --line: #E4D7FC; --line-2: #EFEAF8; --surface-2: #F8F5FE; --surface-hover: #FAF6FF;
    --font-headline: "Mozilla Headline VF", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-text: "Mozilla Text VF", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --r-sm: 12px; --r-md: 16px; --r-lg: 24px; --r-xl: 80px;
    --shadow: 0 14px 26px rgba(33,3,64,.14);
  }
  * { margin: 0; box-sizing: border-box; }
  body { font-family: var(--font-text); color: var(--ink-2); background: #fff; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }

  /* hero header */
  .hero { background: var(--accent-ink); border-radius: 0 0 80px 80px; padding: 72px 72px 60px; position: relative; overflow: hidden; }
  .hero-glow { position: absolute; left: -6%; right: -6%; bottom: -340px; height: 460px; border-radius: 50%; background: var(--accent); filter: blur(70px); opacity: .8; pointer-events: none; }
  .hero-in { position: relative; display: flex; flex-direction: column; gap: 14px; max-width: 720px; }
  .hero .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: #B89CFF; }
  .hero h1 { font-family: var(--font-headline); font-stretch: 75%; font-weight: 600; font-size: 52px; line-height: .98; letter-spacing: -.01em; color: #fff; }
  .hero .sub { font-size: 16px; line-height: 1.5; color: #E4D7FC; }

  /* layout shell */
  .page { max-width: 940px; margin: 0 auto; }
  .body { padding: 76px 72px 72px; display: flex; flex-direction: column; gap: 72px; }
  .b-head { display: flex; flex-direction: column; gap: 6px; margin-bottom: 22px; }
  .b-title { font-family: var(--font-headline); font-weight: 600; font-size: 26px; color: var(--accent-ink); }
  .b-desc { font-size: 14px; color: var(--muted); }

  /* text */
  .lead { font-family: var(--font-headline); font-weight: 600; font-size: 22px; line-height: 1.3; color: var(--accent-ink); text-wrap: pretty; }
  .para { font-size: 15px; line-height: 1.65; color: var(--ink-2); text-wrap: pretty; }
  .stack { display: flex; flex-direction: column; gap: 16px; max-width: 760px; }

  /* table */
  .thead, .trow { display: grid; gap: 16px; align-items: center; }
  .thead { padding: 0 12px 12px; border-bottom: 1px solid var(--line); }
  .th { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .trow { padding: 20px 12px; }
  .trow + .trow { border-top: 1px solid var(--line-2); }
  .cell { font-size: 14px; color: var(--ink-2); }
  .cell-title { display: flex; flex-direction: column; gap: 4px; }
  .cell-title .nm { font-size: 14.5px; font-weight: 600; color: var(--ink); }
  .cell-title .src { font-size: 12px; color: var(--muted); }

  /* cards */
  .card-grid { display: grid; gap: 24px; }
  .card { display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: inherit; border-radius: var(--r-md); transition: transform .16s, filter .16s; }
  a.card:hover { transform: translateY(-4px); filter: drop-shadow(var(--shadow)); }
  .card-img { height: 180px; border-radius: var(--r-md); background: var(--surface-2); background-size: cover; background-position: center; }
  .card .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
  .card .val { font-size: 20px; font-weight: 600; color: var(--ink); line-height: 1.15; }
  .card .brand { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); }
  .fav { width: 16px; height: 16px; border-radius: 4px; background: var(--line); background-size: cover; flex-shrink: 0; display: inline-block; }

  /* list */
  .lgroups { display: flex; flex-direction: column; gap: 26px; }
  .lgroup h3 { font-family: var(--font-headline); font-weight: 600; font-size: 18px; color: var(--accent-ink); padding-bottom: 10px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
  .litems { list-style: none; }
  .litem { font-size: 15px; color: var(--ink); padding: 10px 0 10px 22px; position: relative; border-bottom: 1px solid var(--line-2); }
  .litem::before { content: "›"; position: absolute; left: 4px; color: var(--accent); font-weight: 700; }
  .litem:last-child { border-bottom: none; }

  /* timeline (rail) */
  .rail { display: grid; grid-template-columns: 150px 40px 1fr; column-gap: 20px; }
  .rail .when { text-align: right; padding: 4px 0 40px; display: flex; flex-direction: column; gap: 2px; }
  .rail .when .lbl { font-size: 16px; font-weight: 600; color: var(--ink); }
  .rail .when .eb { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
  .rail .marker { display: flex; flex-direction: column; align-items: center; }
  .rail .dot { width: 14px; height: 14px; margin-top: 4px; border-radius: 999px; flex-shrink: 0; background: #fff; box-shadow: inset 0 0 0 3px #B89CFF; }
  .rail .line { flex: 1; width: 2px; background: var(--line); }
  .rail .what { padding-bottom: 40px; display: flex; flex-direction: column; gap: 7px; }
  .rail .what h3 { font-family: var(--font-headline); font-weight: 600; font-size: 22px; line-height: 1.1; color: var(--accent-ink); }
  .rail .what p { font-size: 13.5px; line-height: 1.55; color: var(--ink-2); max-width: 560px; }

  /* highlight */
  .hl-full { background: var(--accent-ink); border-radius: var(--r-xl); padding: 56px 64px; display: flex; flex-direction: column; gap: 20px; position: relative; overflow: hidden; }
  .hl-full .glow { position: absolute; right: -120px; bottom: -220px; width: 520px; height: 340px; border-radius: 50%; background: var(--accent); filter: blur(70px); opacity: .55; pointer-events: none; }
  .hl-full .eb { position: relative; font-size: 10.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: #B89CFF; }
  .hl-full h2 { position: relative; font-family: var(--font-headline); font-stretch: 75%; font-weight: 600; font-size: 36px; line-height: 1.08; letter-spacing: -.01em; color: #fff; max-width: 820px; text-wrap: pretty; }
  .hl-full p { position: relative; font-size: 15px; line-height: 1.55; color: #E4D7FC; max-width: 680px; }

  /* source links (chip row) — used standalone, in the Header, and in Highlights */
  .links { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .links-t { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); width: 100%; }
  .lchip { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; text-decoration: none; color: #4B3A80; background: var(--accent-soft); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; transition: background .12s, border-color .12s; }
  .lchip:hover { background: #fff; border-color: var(--accent); }
  /* on dark backgrounds (hero / highlight) */
  .hero .links, .hl-full .links { position: relative; margin-top: 4px; }
  .hero .links-t, .hl-full .links-t { color: #B89CFF; }
  .hero .lchip, .hl-full .lchip { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.22); color: #E4D7FC; }
  .hero .lchip:hover, .hl-full .lchip:hover { background: rgba(255,255,255,.24); color: #fff; }

  .err { padding: 48px 72px; }
  .err h2 { font-family: var(--font-headline); color: var(--accent-ink); font-size: 24px; }
  .err p { color: var(--muted); margin-top: 8px; }

  @media (max-width: 720px) {
    .hero, .body, .err { padding-left: 24px; padding-right: 24px; }
    .rail { grid-template-columns: 1fr; }
    .rail .when { text-align: left; }
    .card-grid { grid-template-columns: 1fr !important; }
  }
</style>
</head>
<body>
<div class="page" id="page"></div>

<script>
(function () {
  "use strict";

  function loadSurface() {
    var raw = (location.hash || "").replace(/^#/, "");
    if (raw) {
      var tries = [function () { return decodeURIComponent(raw); }, function () { return raw; }];
      for (var i = 0; i < tries.length; i++) {
        try { return JSON.parse(tries[i]()); } catch (e) {}
      }
      return { __error: "The URL hash after # isn't a valid encoded surface." };
    }
    var node = document.getElementById("surface-config");
    try { return node ? JSON.parse(node.textContent) : { components: [] }; }
    catch (e) { return { __error: "The embedded surface is not valid JSON." }; }
  }
  function indexById(comps) {
    var m = {};
    (comps || []).forEach(function (c) { if (c && c.id) m[c.id] = c; });
    return m;
  }

  var SURFACE = loadSurface();
  var DM = SURFACE.dataModel || {};
  var byId = indexById(SURFACE.components);
  var root = document.getElementById("page");

  /* ---- helpers ---- */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function bg(url) { return url ? "background-image:url(&quot;" + esc(url) + "&quot;)" : ""; }
  function isBinding(v) {
    return v && typeof v == "object" && !Array.isArray(v) && typeof v.path == "string" && Object.keys(v).length === 1;
  }
  function ptr(rootObj, path) {
    var segs = path.replace(/^\//, "").split("/");
    var n = rootObj;
    for (var i = 0; i < segs.length; i++) {
      if (n == null || typeof n != "object") return undefined;
      n = n[segs[i].replace(/~1/g, "/").replace(/~0/g, "~")];
    }
    return n;
  }
  function resolve(v, scope) {
    if (isBinding(v)) return v.path.charAt(0) === "/" ? ptr(DM, v.path) : ptr(scope, v.path);
    return v;
  }
  function txt(v, scope) { var r = resolve(v, scope); return r == null ? "" : String(r); }
  function list(v, scope) {
    var r = resolve(v, scope);
    return Array.isArray(r) ? r : Array.isArray(v) ? v : [];
  }
  function head(c) {
    var t = c.title ? esc(txt(c.title)) : "", d = c.description ? esc(txt(c.description)) : "";
    if (!t && !d) return "";
    return '<div class="b-head">' + (t ? '<div class="b-title">' + t + "</div>" : "") +
      (d ? '<div class="b-desc">' + d + "</div>" : "") + "</div>";
  }
  function fmt(field, v) {
    if (v == null || v === "") return "";
    var pre = field.prefix || "", suf = field.suffix || "";
    switch (field.type) {
      case "currency": return pre + Number(v).toLocaleString(undefined, { style: "currency", currency: field.currency || "USD", maximumFractionDigits: 0 }) + suf;
      case "number": return pre + Number(v).toLocaleString() + suf;
      case "rating": return pre + v + " / " + (field.max || 5) + suf;
      case "date": var d = new Date(v); return isNaN(d) ? esc(v) : d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
      default: return pre + esc(v) + suf;
    }
  }
  // Render a SourceLinks value (used by the SourceLinks block, Header.references,
  // and Highlights.sources). `sl` is { title?, items }.
  function sourceLinks(sl, scope) {
    if (!sl) return "";
    var items = list(sl.items, scope);
    if (!items.length && !sl.title) return "";
    var chips = items.map(function (s) {
      return '<a class="lchip" href="' + esc(s.href) + '" target="_blank" rel="noopener">' +
        (s.favicon ? '<span class="fav" style="' + bg(s.favicon) + '"></span>' : "") +
        esc(s.title || s.href) + "</a>";
    }).join("");
    return '<div class="links">' + (sl.title ? '<span class="links-t">' + esc(txt(sl.title, scope)) + "</span>" : "") + chips + "</div>";
  }

  /* ==========================================================================
     RENDERERS — one per catalog component type. Return an HTML string.
     ========================================================================== */
  var RENDERERS = {
    Header: function (c) {
      return '<div class="hero"><div class="hero-glow"></div><div class="hero-in">' +
        (c.eyebrow && txt(c.eyebrow) ? '<span class="eyebrow">' + esc(txt(c.eyebrow)) + "</span>" : "") +
        "<h1>" + esc(txt(c.title)) + "</h1>" +
        (c.subhead ? '<span class="sub">' + esc(txt(c.subhead)) + "</span>" : "") +
        sourceLinks(c.references, DM) + "</div></div>";
    },

    TextBlock: function (c) {
      var body = (c.lead ? '<span class="lead">' + esc(txt(c.lead)) + "</span>" : "") +
        list(c.paragraphs).map(function (p) { return '<span class="para">' + esc(typeof p === "string" ? p : txt(p)) + "</span>"; }).join("");
      return '<section class="block">' + head(c) + '<div class="stack">' + body + "</div></section>";
    },

    RankedTable: function (c) {
      var cols = c.columns || [];
      var titleF = cols.filter(function (f) { return f.role === "title"; })[0];
      var subF = cols.filter(function (f) { return f.role === "subtitle"; })[0];
      var details = cols.filter(function (f) { return (f.role || "detail") === "detail"; });
      var gtc = "1fr" + details.map(function () { return " 130px"; }).join("");
      var thead = '<div class="thead" style="grid-template-columns:' + gtc + '">' +
        '<span class="th">' + esc(titleF ? titleF.label || "Name" : "Name") + "</span>" +
        details.map(function (f) { return '<span class="th">' + esc(f.label || "") + "</span>"; }).join("") + "</div>";
      var rows = list(c.rows).map(function (r) {
        var cells = '<span class="cell-title"><span class="nm">' + esc(r[titleF ? titleF.key : ""]) + "</span>" +
          (subF && r[subF.key] != null ? '<span class="src">' + esc(r[subF.key]) + "</span>" : "") + "</span>";
        details.forEach(function (f) { cells += '<span class="cell">' + fmt(f, r[f.key]) + "</span>"; });
        return '<div class="trow" style="grid-template-columns:' + gtc + '">' + cells + "</div>";
      }).join("");
      return '<section class="block">' + head(c) + "<div>" + thead + rows + "</div></section>";
    },

    Cards: function (c) {
      var items = list(c.items);
      var n = Math.min(Math.max(items.length, 1), 3);
      var cards = items.map(function (it) {
        var tag = it.href ? "a" : "div", href = it.href ? ' href="' + esc(it.href) + '" target="_blank" rel="noopener"' : "";
        return "<" + tag + ' class="card"' + href + ">" +
          '<div class="card-img" style="' + bg(it.image) + '"></div>' +
          (it.eyebrow ? '<span class="eyebrow">' + esc(it.eyebrow) + "</span>" : "") +
          '<span class="val">' + esc(it.title) + "</span>" +
          (it.link_title || it.favicon
            ? '<span class="brand">' + (it.favicon ? '<span class="fav" style="' + bg(it.favicon) + '"></span>' : "") + esc(it.link_title || "") + "</span>"
            : "") +
          "</" + tag + ">";
      }).join("");
      return '<section class="block">' + head(c) +
        '<div class="card-grid" style="grid-template-columns:repeat(' + n + ', 1fr)">' + cards + "</div></section>";
    },

    SourceLinks: function (c) {
      return '<section class="block">' + head(c) + sourceLinks({ items: c.items }, DM) + "</section>";
    },

    List: function (c) {
      var groups = list(c.groups).map(function (g) {
        var items = (list(g.items) || []).map(function (it) { return '<li class="litem">' + esc(it.text) + "</li>"; }).join("");
        return '<div class="lgroup">' + (g.heading ? "<h3>" + esc(g.heading) + "</h3>" : "") + '<ul class="litems">' + items + "</ul></div>";
      }).join("");
      return '<section class="block">' + head(c) + '<div class="lgroups">' + groups + "</div></section>";
    },

    Timeline: function (c) {
      var items = list(c.items);
      var rail = items.map(function (it, i) {
        var last = i === items.length - 1;
        return '<div class="when">' + (it.date_eyebrow ? '<span class="eb">' + esc(it.date_eyebrow) + "</span>" : "") +
          '<span class="lbl">' + esc(it.date_label || "") + "</span></div>" +
          '<div class="marker"><span class="dot"></span>' + (last ? "" : '<span class="line"></span>') + "</div>" +
          '<div class="what"><h3>' + esc(it.title) + "</h3>" + (it.description ? "<p>" + esc(it.description) + "</p>" : "") + "</div>";
      }).join("");
      return '<section class="block">' + head(c) + '<div class="rail">' + rail + "</div></section>";
    },

    Highlights: function (c) {
      return '<section class="block"><div class="hl-full"><div class="glow"></div>' +
        (c.eyebrow ? '<span class="eb">' + esc(txt(c.eyebrow)) + "</span>" : "") +
        (c.title ? "<h2>" + esc(txt(c.title)) + "</h2>" : "") +
        (c.body ? "<p>" + esc(txt(c.body)) + "</p>" : "") +
        sourceLinks(c.sources, DM) + "</div></section>";
    }
  };

  /* ---- compose ---- */
  function renderComp(c, scope) { var r = RENDERERS[c.component]; return r ? r(c, scope) : ""; }
  function renderChildren(childList, scope) {
    if (Array.isArray(childList)) {
      return childList.map(function (id) { var c = byId[id]; return c ? renderComp(c, scope) : ""; }).join("");
    }
    if (childList && typeof childList === "object" && childList.componentId) {
      var tmpl = byId[childList.componentId];
      return tmpl ? list(childList, scope).map(function (item) { return renderComp(tmpl, item); }).join("") : "";
    }
    return "";
  }
  function errorHtml(msg) {
    return '<div class="err"><h2>Couldn’t load this view</h2><p>' + esc(msg) + "</p></div>";
  }
  function build() {
    if (SURFACE && SURFACE.__error) { root.innerHTML = errorHtml(SURFACE.__error); return; }
    var pageComp = byId.root;
    if (!pageComp || pageComp.component !== "Page") {
      root.innerHTML = errorHtml('the surface needs one component with id "root" of type "Page".');
      return;
    }
    var html = "";
    if (pageComp.header && byId[pageComp.header]) html += renderComp(byId[pageComp.header], DM);
    html += '<div class="body">' + renderChildren(pageComp.children, DM) + "</div>";
    root.innerHTML = html;
  }

  window.addEventListener("hashchange", function () {
    SURFACE = loadSurface(); DM = SURFACE.dataModel || {}; byId = indexById(SURFACE.components); build();
  });

  build();
})();
</script>
</body>
</html>
