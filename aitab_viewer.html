(function () {
  "use strict";

  // Read the surface from the URL hash; fall back to the embedded demo.
  function loadSurface() {
    var raw = (location.hash || "").replace(/^#/, "");
    if (raw) {

    if (pageComp.header && byId[pageComp.header]) html += renderComp(byId[pageComp.header], DM);
    html += '<div class="body">' + renderChildren(pageComp.children, DM) + "</div>";
    if (pageComp.footer && byId[pageComp.footer]) html += renderComp(byId[pageComp.footer], DM);
    root.innerHTML = html;
  }

  /* ---- interactivity ---- */
  root.addEventListener("change", function (e) {
    if (!e.target.classList.contains("cb")) return;
    var li = e.target.closest("[data-g]"), sec = e.target.closest("[data-block]");
    if (!li || !sec) return;
    var comp = byId[sec.getAttribute("data-block")];
    if (!comp) return;
    var groups = list(comp.groups);         // ref into the data model (or literal)
    var g = +li.getAttribute("data-g"), i = +li.getAttribute("data-i");
    if (groups[g] && groups[g].items && groups[g].items[i]) {
      groups[g].items[i].done = e.target.checked;
      build();
    }
  });
  root.addEventListener("click", function (e) {
    var th = e.target.closest("[data-sort]"); if (!th) return;
    var p = th.getAttribute("data-sort").split(":"), id = p[0], key = p[1];
    var cur = sortState[id];
    sortState[id] = (cur && cur.key === key) ? { key: key, dir: cur.dir === "asc" ? "desc" : "asc" } : { key: key, dir: "asc" };
    build();
  });
  window.addEventListener("hashchange", function () {
    SURFACE = loadSurface(); DM = SURFACE.dataModel || {}; byId = indexById(SURFACE.components); sortState = {}; build();
  });

  build();
})();
</script>
</body>
</html>
