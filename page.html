  .chip { font-size: 12.5px; color: #4B3A80; background: rgba(255,255,255,.7); border: 1px solid #D9CFF0; border-radius: 999px; padding: 9px 16px; text-decoration: none; transition: background .12s, border-color .12s, transform .12s; }
  .chip:hover { background: #fff; border-color: var(--accent); color: var(--accent-ink); transform: translateY(-1px); }
  .chip.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .chip.primary:hover { color: #fff; }

  @media (max-width: 720px) {
    .hero, .body, .keep { padding-left: 24px; padding-right: 24px; }
    .side, .kv, .check-cols, .tk, .bn, .rail, .wide-card { grid-template-columns: 1fr; }
    .hl-trio, .verdict, .card-grid { grid-template-columns: 1fr !important; }
    .rail .when { text-align: left; }
  }
</style>
</head>
<body>
<div class="page" id="page"></div>

<script>
(function () {
  "use strict";

  // Config comes from the URL hash: "#" + encodeURIComponent(JSON.stringify(page)).
  // Falls back to the embedded #page-config demo when there is no hash.
  function loadConfig() {
    var raw = (location.hash || "").replace(/^#/, "");
    if (raw) {
      var candidates = [function () { return decodeURIComponent(raw); }, function () { return raw; }];
      for (var i = 0; i < candidates.length; i++) {
        try { return JSON.parse(candidates[i]()); } catch (e) {}
      }
      return { __error: "The URL hash after # isn't valid encoded JSON." };
    }
    var node = document.getElementById("page-config");
    try { return node ? JSON.parse(node.textContent) : { blocks: [] }; }
    catch (e) { return { __error: "The embedded page-config is not valid JSON." }; }
  }

  var PAGE = loadConfig();
  var root = document.getElementById("page");
  var sortState = {};   // blockIndex -> { key, dir }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function bg(url) { return "background-image:url(&quot;" + esc(url) + "&quot;)"; }

  /* ---- field helpers (record tables) ---- */
  function role(fields, r) { return fields.filter(function (f) { return (f.role || "detail") === r; }); }
  function first(fields, r) { return role(fields, r)[0] || null; }
  function fmt(field, v) {
    if (v == null || v === "") return "";
    var pre = field.prefix || "", suf = field.suffix || "";
    switch (field.type) {
      case "currency": return pre + Number(v).toLocaleString(undefined, { style: "currency", currency: field.currency || "USD", maximumFractionDigits: 0 }) + suf;
      case "number": return pre + Number(v).toLocaleString() + suf;
      case "rating": return pre + v + " / " + (field.max || 5) + suf;
      case "date": var d = new Date(v); return isNaN(d) ? esc(v) : d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
      case "boolean": return v ? "Yes" : "No";
      case "tags": return (v || []).join(", ");
      default: return pre + esc(v) + suf;
    }
  }
  var NUM = { currency: 1, number: 1, rating: 1 };
  function bestRow(fields, rows) {
    var usable = fields.filter(function (f) { return f.goal && NUM[f.type]; }).map(function (f) {
      var vals = rows.map(function (r) { return +r[f.key]; }).filter(function (x) { return !isNaN(x); });
      if (!vals.length) return null;
      var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
      return mx !== mn ? { f: f, mn: mn, mx: mx } : null;
    }).filter(Boolean);
    if (usable.length < 2 || rows.length < 2) return -1;
    var best = -1, top = -1;
    rows.forEach(function (r, i) {
      var s = 0, n = 0;
      usable.forEach(function (u) { var v = +r[u.f.key]; if (isNaN(v)) return; var nm = (v - u.mn) / (u.mx - u.mn); if (u.f.goal === "min") nm = 1 - nm; s += nm; n++; });
      if (n) { var sc = s / n; if (sc > top) { top = sc; best = i; } }
    });
    return best;
  }
  function sortRows(rows, fields, idx) {
    var st = sortState[idx]; if (!st) return rows.slice();
    var f = fields.filter(function (x) { return x.key === st.key; })[0]; if (!f) return rows.slice();
    var dir = st.dir === "desc" ? -1 : 1;
    return rows.slice().sort(function (a, b) {
      var x = a[st.key], y = b[st.key];
      if (typeof x === "number" && typeof y === "number") return (x - y) * dir;
      return String(x).localeCompare(String(y)) * dir;
    });
  }

  function head(block) {
    if (!block.title && !block.description) return "";
    return '<div class="b-head">' + (block.title ? '<div class="b-title">' + esc(block.title) + "</div>" : "") +
      (block.description ? '<div class="b-desc">' + esc(block.description) + "</div>" : "") + "</div>";
  }

  /* ==========================================================================
     RENDERERS  — one per block type; each dispatches on `layout`.
     ========================================================================== */
  var RENDERERS = {
    header: function (b) {
      return '<div class="hero"><div class="hero-glow"></div><div class="hero-in">' +
        (b.eyebrow ? '<span class="eyebrow">' + esc(b.eyebrow) + "</span>" : "") +
        '<div class="hero-title">' + (b.icon ? '<span class="ic">' + esc(b.icon) + "</span>" : "") +
        "<h1>" + esc(b.title) + "</h1></div>" +
        (b.subhead ? '<span class="sub">' + esc(b.subhead) + "</span>" : "") + "</div></div>";
    },

    text: function (b) {
      if (b.layout === "quote") {
        return '<section class="block"><div class="quote-box"><span class="q">' + esc(b.quote) + "</span>" +
          (b.attribution ? '<span class="attr">' + esc(b.attribution) + "</span>" : "") + "</div></section>";
      }
      if (b.layout === "subheads") {
        var sects = (b.sections || []).map(function (s) { return '<div class="sect"><h3>' + esc(s.heading) + "</h3><p class=\"para\">" + esc(s.body) + "</p></div>"; }).join("");
        return '<section class="block">' + head(b) + '<div class="stack" style="gap:32px">' + sects + "</div></section>";
      }
      var body = (b.lead ? '<span class="lead">' + esc(b.lead) + "</span>" : "") +
        (b.paragraphs || []).map(function (p) { return '<span class="para">' + esc(p) + "</span>"; }).join("");
      if (b.layout === "side-title") {
        return '<section class="block"><div class="side"><div><div class="side-title">' + esc(b.title || "") + "</div>" +
          (b.subtitle ? '<div class="side-sub">' + esc(b.subtitle) + "</div>" : "") + '</div><div class="stack">' + body + "</div></div></section>";
      }
      return '<section class="block">' + head(b) + '<div class="stack">' + body + "</div></section>";
    },

    table: function (b, idx) {
      if (b.layout === "key-value") {
        var pairs = (b.pairs || []).map(function (p) { return '<div class="pair"><span class="k">' + esc(p.label) + '</span><span class="v">' + esc(p.value) + "</span></div>"; }).join("");
        return '<section class="block">' + head(b) + '<div class="kv">' + pairs + "</div></section>";
      }
      if (b.layout === "matrix") {
        var cols = b.columns || [], rows = b.rows || [];
        var gtc = "150px" + " 1fr".repeat(cols.length);
        var h = '<div class="matrix" style="grid-template-columns:' + gtc + '"><div></div>';
        cols.forEach(function (c) { h += '<div class="mcol">' + (c.label ? '<span class="eyebrow">' + esc(c.label) + "</span>" : "") + '<span class="nm">' + esc(c.name) + "</span></div>"; });
        rows.forEach(function (r) {
          h += '<div class="mlabel">' + esc(r.label) + "</div>";
          (r.cells || []).forEach(function (cell) {
            h += '<div class="mcell' + (cell.winner ? " win" : "") + '"><span>' + esc(cell.value) + "</span>" +
              (cell.note ? '<span class="pill">' + esc(cell.note) + "</span>" : "") + "</div>";
          });
        });
        h += "</div>";
        return '<section class="block">' + head(b) + h + "</section>";
      }
      // record layouts: ranked / thumbnail / grouped / side-title
      var fields = b.fields || [], data = b.data || [];
      var titleF = first(fields, "title"), subF = first(fields, "subtitle"), imgF = first(fields, "image"), actF = first(fields, "action");
      var details = role(fields, "detail");
      var thumb = b.layout === "thumbnail" && imgF;
      var rows = sortRows(data, fields, idx);
      var best = bestRow(fields, data);
      var bestKey = best >= 0 ? data[best] : null;

      var cols = (thumb ? "88px " : "") + "1fr" + details.map(function () { return " 130px"; }).join("");
      var thead = '<div class="thead" style="grid-template-columns:' + cols + '">' + (thumb ? "<span></span>" : "") +
        '<span class="th">' + esc(titleF ? titleF.label || "Name" : "Name") + "</span>";
      details.forEach(function (f) {
        var sortable = f.sortable;
        var st = sortState[idx];
        var caret = st && st.key === f.key ? (st.dir === "desc" ? " ▼" : " ▲") : "";
        thead += '<span class="th' + (sortable ? " sortable" : "") + '"' + (sortable ? ' data-sort="' + idx + ":" + f.key + '"' : "") + ">" + esc(f.label) + (caret ? '<span class="caret">' + caret + "</span>" : "") + "</span>";
      });
      thead += "</div>";

      var rowsHtml = rows.map(function (r) {
        var isBest = bestKey && r === bestKey;
        var href = actF && r[actF.key];
        var tag = href ? "a" : "div", attrs = href ? ' href="' + esc(r[actF.key]) + '"' : "";
        var cellsHtml = "";
        if (thumb) cellsHtml += '<span class="thumb" style="' + (r[imgF.key] ? bg(r[imgF.key]) : "") + '"></span>';
        cellsHtml += '<span class="cell-title"><span class="nm">' + esc(r[titleF ? titleF.key : ""]) + "</span>" +
          (subF && r[subF.key] ? '<span class="src">' + esc(r[subF.key]) + "</span>" : "") + "</span>";
        details.forEach(function (f) { cellsHtml += '<span class="cell">' + fmt(f, r[f.key]) + "</span>"; });
        return "<" + tag + ' class="trow' + (isBest ? " best" : "") + '" style="grid-template-columns:' + cols + '"' + attrs + ">" + cellsHtml + "</" + tag + ">";
      }).join("");

      var table = '<div>' + thead + rowsHtml + "</div>";
      if (b.layout === "side-title") {
        return '<section class="block"><div class="side"><div><div class="side-title">' + esc(b.title || "") + "</div>" +
          (b.description ? '<div class="side-sub">' + esc(b.description) + "</div>" : "") + "</div>" + table + "</div></section>";
      }
      if (b.layout === "grouped" && b.groupBy) {
        var groups = {};
        rows.forEach(function (r) { var g = r[b.groupBy] || ""; (groups[g] = groups[g] || []).push(r); });
        var gcols = "1fr" + details.map(function () { return " 130px"; }).join("");
        var gh = "";
        Object.keys(groups).forEach(function (g) {
          var inner = groups[g].map(function (r) {
            var c = '<span class="cell-title"><span class="nm">' + esc(r[titleF.key]) + "</span>" + (subF && r[subF.key] ? '<span class="src">' + esc(r[subF.key]) + "</span>" : "") + "</span>";
            details.forEach(function (f) { c += '<span class="cell">' + fmt(f, r[f.key]) + "</span>"; });
            return '<div class="trow" style="grid-template-columns:' + gcols + ';border:none;padding:14px 0">' + c + "</div>";
          }).join("");
          gh += '<div class="group-row"><span class="gname">' + esc(g) + "</span><div>" + inner + "</div></div>";
        });
        return '<section class="block">' + head(b) + gh + "</section>";
      }
      return '<section class="block">' + head(b) + table + "</section>";
    },

    cards: function (b) {
      var items = b.items || [];
      if (b.layout === "wide-detail") {
        var wc = items.map(function (it) {
          var specs = (it.specs || []).map(function (s) { return '<span class="s"><span class="k">' + esc(s.label) + '</span><span class="v">' + esc(s.value) + "</span></span>"; }).join("");
          var tag = it.href ? "a" : "div", href = it.href ? ' href="' + esc(it.href) + '"' : "";
          return "<" + tag + ' class="wide-card"' + href + '><div class="card-img" style="' + (it.image ? bg(it.image) : "") + '"></div><div class="stack" style="gap:12px">' +
            (it.eyebrow ? '<span class="eyebrow" style="color:var(--accent);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase">' + esc(it.eyebrow) + "</span>" : "") +
            (it.title ? '<span class="b-title">' + esc(it.title) + "</span>" : "") +
            (it.body ? '<span class="para" style="font-size:13.5px">' + esc(it.body) + "</span>" : "") +
            (specs ? '<div class="specs">' + specs + "</div>" : "") + "</div></" + tag + ">";
        }).join("");
        return '<section class="block">' + head(b) + '<div class="stack" style="max-width:none;gap:16px">' + wc + "</div></section>";
      }
      if (b.layout === "source-tiles") {
        var st = items.map(function (it) {
          var tag = it.href ? "a" : "div", href = it.href ? ' href="' + esc(it.href) + '"' : "";
          return "<" + tag + ' class="src-tile"' + href + '><span class="dom"><span class="fav" style="' + (it.favicon ? bg(it.favicon) : "") + '"></span>' + esc(it.subtitle || "") + "</span>" +
            (it.title ? '<span class="st">' + esc(it.title) + "</span>" : "") +
            (it.body ? '<span class="sb">' + esc(it.body) + "</span>" : "") + "</" + tag + ">";
        }).join("");
        return '<section class="block">' + head(b) + '<div class="card-grid" style="grid-template-columns:1fr 1fr">' + st + "</div></section>";
      }
      // picks / centered — image grid cards
      var cols = b.layout === "centered" ? "1fr 1fr" : "repeat(3, 1fr)";
      var cards = items.map(function (it) {
        var tag = it.href ? "a" : "div", href = it.href ? ' href="' + esc(it.href) + '"' : "";
        return "<" + tag + ' class="card"' + href + ">" +
          '<div class="card-img" style="' + (it.image ? bg(it.image) : "") + '"></div>' +
          (it.eyebrow ? '<span class="eyebrow">' + esc(it.eyebrow) + "</span>" : "") +
          (it.value ? '<span class="val">' + esc(it.value) + "</span>" : "") +
          (it.title && !it.value ? '<span class="val">' + esc(it.title) + "</span>" : "") +
          (it.subtitle ? '<span class="brand"><span class="fav" style="' + (it.favicon ? bg(it.favicon) : "") + '"></span>' + esc(it.value ? it.title || it.subtitle : it.subtitle) + "</span>" : "") +
          "</" + tag + ">";
      }).join("");
      var inner = '<div class="card-grid" style="grid-template-columns:' + cols + '">' + cards + "</div>";
      if (b.layout === "centered") return '<section class="block"><div class="center-title display">' + esc(b.title || "") + "</div>" + inner + "</section>";
      return '<section class="block">' + head(b) + inner + "</section>";
    },

    list: function (b, idx) {
      if (b.layout === "takeaways") {
        var tk = (b.items || []).map(function (it, i) {
          var n = it.number || String(i + 1).padStart(2, "0");
          return '<div class="tk"><div><span class="num">' + esc(n) + '</span><div class="claim">' + esc(it.title || "") + "</div></div><div><span class=\"ev\">" + esc(it.body || "") + "</span></div></div>";
        }).join("");
        return '<section class="block">' + (b.title ? '<div class="center-title display">' + esc(b.title) + "</div>" : "") + tk + "</section>";
      }
      if (b.layout === "big-number") {
        var bn = (b.items || []).map(function (it) {
          return '<div class="bn"><span class="fig">' + esc(it.number || "") + '</span><div><div class="bt">' + esc(it.title || "") + "</div>" + (it.body ? '<div class="bb">' + esc(it.body) + "</div>" : "") + "</div></div>";
        }).join("");
        return '<section class="block">' + head(b) + bn + "</section>";
      }
      // checklist / side-title  (groups of checkboxes)
      var groups = b.groups || [];
      var total = 0, done = 0;
      groups.forEach(function (g) { (g.items || []).forEach(function (t) { total++; if (t.done) done++; }); });
      var groupsHtml = groups.map(function (g, gi) {
        var items = (g.items || []).map(function (t, ti) {
          return '<label class="citem" data-g="' + gi + '" data-i="' + ti + '"><input type="checkbox" class="cb"' + (t.done ? " checked" : "") + '/><span class="ct">' + esc(t.text) + "</span></label>";
        }).join("");
        return '<div class="cgroup"><h3>' + esc(g.heading) + "</h3>" + items + "</div>";
      }).join("");
      var prog = (b.showProgress !== false && total) ? '<div class="prog">' + done + " of " + total + " done</div>" : "";
      var grid = '<div class="check-cols" data-block="' + idx + '">' + groupsHtml + "</div>";
      if (b.layout === "side-title") {
        return '<section class="block"><div class="side"><div><div class="side-title">' + esc(b.title || "") + "</div></div><div>" + prog + grid + "</div></div></section>";
      }
      return '<section class="block">' + head(b) + prog + grid + "</section>";
    },

    timeline: function (b) {
      var items = b.items || [];
      if (b.layout === "horizontal") {
        var gtc = "repeat(" + items.length + ", 1fr)";
        var dots = items.map(function (it, i) {
          return '<div class="step-dot"><span class="d' + (it.state === "now" ? " now" : "") + '"></span>' + (i < items.length - 1 ? '<span class="l"></span>' : "") + "</div>";
        }).join("");
        var steps = items.map(function (it) {
          return '<div class="step' + (it.state === "now" ? " now" : "") + '">' + (it.eyebrow ? '<span class="eb">' + esc(it.eyebrow) + "</span>" : "") +
            "<h3>" + esc(it.title) + "</h3>" + (it.body ? "<p>" + esc(it.body) + "</p>" : "") + "</div>";
        }).join("");
        return '<section class="block">' + head(b) + '<div class="horiz" style="grid-template-columns:' + gtc + '">' + dots + steps + "</div></section>";
      }
      if (b.layout === "day-schedule") {
        var days = items.map(function (it) {
          return '<div class="day' + (it.state === "now" ? " now" : "") + '"><div><div class="time">' + esc(it.label || "") + "</div>" +
            (it.sublabel ? '<div class="period">' + esc(it.sublabel) + "</div>" : "") + "</div><div><h3>" + esc(it.title) + "</h3>" +
            (it.body ? "<p>" + esc(it.body) + "</p>" : "") + "</div></div>";
        }).join("");
        return '<section class="block">' + head(b) + '<div class="stack" style="max-width:none;gap:8px">' + days + "</div></section>";
      }
      // phase-rail / side-title (vertical rail)
      var rail = items.map(function (it, i) {
        var last = i === items.length - 1;
        return '<div class="when">' + (it.eyebrow ? '<span class="eb">' + esc(it.eyebrow) + "</span>" : "") +
          '<span class="lbl">' + esc(it.label || "") + "</span>" + (it.sublabel ? '<span class="sub">' + esc(it.sublabel) + "</span>" : "") + "</div>" +
          '<div class="marker"><span class="dot' + (it.state === "now" ? " now" : "") + '"></span>' + (last ? "" : '<span class="line"></span>') + "</div>" +
          '<div class="what"><h3>' + esc(it.title) + "</h3>" + (it.body ? "<p>" + esc(it.body) + "</p>" : "") + "</div>";
      }).join("");
      var railHtml = '<div class="rail">' + rail + "</div>";
      if (b.layout === "side-title") {
        return '<section class="block"><div class="side"><div><div class="side-title">' + esc(b.title || "") + "</div>" +
          (b.description ? '<div class="side-sub">' + esc(b.description) + "</div>" : "") + "</div>" + railHtml + "</div></section>";
      }
      return '<section class="block">' + head(b) + railHtml + "</section>";
    },

    highlight: function (b) {
      if (b.layout === "number-trio") {
        var boxes = (b.items || []).map(function (it) {
          return '<div class="hl-box"><span class="fig">' + esc(it.value) + '</span><span class="lb">' + esc(it.label) + "</span>" +
            (it.body ? '<span class="bd">' + esc(it.body) + "</span>" : "") + "</div>";
        }).join("");
        return '<section class="block"><div class="hl-trio">' + boxes + "</div></section>";
      }
      if (b.layout === "verdict-pair") {
        var vb = (b.boxes || []).map(function (box) {
          var pts = (box.points || []).map(function (p) {
            return '<div class="pt">' + (p.title ? '<div class="pt-t">' + esc(p.title) + "</div>" : "") + '<div class="pt-b">' + esc(p.body) + "</div></div>";
          }).join("");
          return '<div class="vbox ' + (box.tone === "dark" ? "dark" : "light") + '"><h3>' + esc(box.title) + "</h3>" + pts + "</div>";
        }).join("");
        return '<section class="block"><div class="verdict">' + vb + "</div></section>";
      }
      // full-width
      return '<section class="block"><div class="hl-full"><div class="glow"></div>' +
        (b.eyebrow ? '<span class="eb">' + esc(b.eyebrow) + "</span>" : "") +
        (b.title ? "<h2>" + esc(b.title) + "</h2>" : "") +
        (b.body ? "<p>" + esc(b.body) + "</p>" : "") + "</div></section>";
    },

    footer: function (b) {
      var chips = (b.buttons || []).map(function (btn) {
        return '<a class="chip' + (btn.variant === "primary" ? " primary" : "") + '" href="' + esc(btn.href) + '">' + esc(btn.text) + "</a>";
      }).join("");
      return '<div class="keep">' + (b.text ? "<h2>" + esc(b.text) + "</h2>" : "") + '<div class="chips">' + chips + "</div></div>";
    }
  };

  /* ---- compose ---- */
  function build() {
    if (PAGE && PAGE.__error) {
      root.innerHTML = '<div class="body"><section class="block"><h2 class="b-title">Couldn’t load this view</h2>' +
        '<p class="b-desc">' + esc(PAGE.__error) + "</p></section></div>";
      return;
    }
    var html = "";
    if (PAGE.header) html += RENDERERS.header(PAGE.header);
    html += '<div class="body">';
    (PAGE.blocks || []).forEach(function (b, i) { html += RENDERERS[b.type] ? RENDERERS[b.type](b, i) : ""; });
    html += "</div>";
    if (PAGE.footer) html += RENDERERS.footer(PAGE.footer);
    root.innerHTML = html;
  }

  /* ---- interactivity: checklist toggle + table sort ---- */
  root.addEventListener("change", function (e) {
    if (!e.target.classList.contains("cb")) return;
    var label = e.target.closest("[data-g]"), grid = e.target.closest("[data-block]");
    if (!label || !grid) return;
    var block = PAGE.blocks[+grid.getAttribute("data-block")];
    block.groups[+label.getAttribute("data-g")].items[+label.getAttribute("data-i")].done = e.target.checked;
    build();
  });
  root.addEventListener("click", function (e) {
    var th = e.target.closest("[data-sort]"); if (!th) return;
    var parts = th.getAttribute("data-sort").split(":"), idx = +parts[0], key = parts[1];
    var cur = sortState[idx];
    sortState[idx] = (cur && cur.key === key) ? { key: key, dir: cur.dir === "asc" ? "desc" : "asc" } : { key: key, dir: "asc" };
    build();
  });

  // re-render when the hash changes (e.g. pasting a new viewer link)
  window.addEventListener("hashchange", function () { PAGE = loadConfig(); sortState = {}; build(); });

  build();
})();
</script>
</body>
